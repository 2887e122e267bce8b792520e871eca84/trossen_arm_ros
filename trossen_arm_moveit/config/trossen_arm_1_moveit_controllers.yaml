# MoveIt uses this configuration for controller management
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_manager_name: /trossen_arm_1/controller_manager
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - trossen_arm_1/joint_0
      - trossen_arm_1/joint_1
      - trossen_arm_1/joint_2
      - trossen_arm_1/joint_3
      - trossen_arm_1/joint_4
      - trossen_arm_1/joint_5

  gripper_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    allow_nonzero_velocity_at_trajectory_end: false
    default: true
    max_effort: 100.0
    joints:
      - trossen_arm_1/left_carriage_joint
